services:
  postgres:
    image: postgres:15-alpine
    container_name: absensi-postgre
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - data-absensi:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promet_user -d promet_ticket"]
      interval: 5s
      timeout: 5s
      retries: 5    

volumes:
  data-absensi:
